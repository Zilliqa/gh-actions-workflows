name: Generate actions documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-doc:
    runs-on: ubuntu-latest
    # Skip on PRs from forks: PAT_TOKEN cannot push to a fork's branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Regenerate ci-dockerized-app-build-push README
        uses: tj-actions/auto-doc@b10ceedffd794ec29a8fa8700529f40c1b64a951 # v3.6.0
        with:
          filename: "actions/ci-dockerized-app-build-push/action.yml"
          output: "actions/ci-dockerized-app-build-push/README.md"

      - name: Regenerate generate-tag README
        uses: tj-actions/auto-doc@b10ceedffd794ec29a8fa8700529f40c1b64a951 # v3.6.0
        with:
          filename: "actions/generate-tag/action.yml"
          output: "actions/generate-tag/README.md"

      - name: Lint READMEs with remark
        uses: tj-actions/remark@10fc40701928cbafcc4a2d241679579d218144ff # v3
        with:
          files: |
            actions/ci-dockerized-app-build-push/README.md
            actions/generate-tag/README.md

      - name: Commit and push regenerated READMEs
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain actions/)" ]]; then
            echo "No README changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actions/
          git commit -m "docs: regenerate composite action READMEs"
          git push origin HEAD:${{ github.head_ref }}
